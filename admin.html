<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Ruchi - Admin Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- LOGIN SECTION -->
    <section id="loginSection" class="login-section">
        <div class="login-box">
            <div class="logo">
                🌶️
            </div>
            <h1>Mana Ruchi</h1>
            <h2>Admin Login</h2>
            <form id="loginForm">
                <label for="username">
                    Username
                </label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
                <button type="submit" class="login-btn">
                    🔐 Login
                </button>
                <p id="loginError" class="login-error"></p>
            </form>
            <a href="index.html" class="back-link">
                ← Back to Mana Ruchi
            </a>
        </div>
    </section>
    <!-- DASHBOARD SECTION -->
    <section id="dashboardSection" class="dashboard-section hidden">
        <!-- HEADER -->
        <header class="dashboard-header">
            <div>
                <h1>🌶️ Mana Ruchi</h1>
                <p>Admin Dashboard</p>
            </div>
            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </header>
        <!-- MAIN CONTENT -->
        <main class="dashboard-content">
            <h2>Dashboard</h2>
            <!-- STAT CARDS -->
            <div class="stats">
                <div class="stat-card">
                    <span>📦</span>
                    <h3 id="totalOrders">0</h3>
                    <p>Total Orders</p>
                </div>
                <div class="stat-card">
                    <span>⏳</span>
                    <h3 id="pendingOrders">0</h3>
                    <p>Pending Orders</p>
                </div>
                <div class="stat-card">
                    <span>✅</span>
                    <h3 id="completedOrders">0</h3>
                    <p>Completed Orders</p>
                </div>
            </div>
            <!-- ORDERS -->
            <div class="orders-section">
                <div class="orders-header">
                    <h2>Customer Orders</h2>
                    <button
                        id="clearOrdersBtn"
                        class="clear-btn">
                        Clear Orders
                    </button>
                </div>
                <div id="ordersContainer">
                    <div class="no-orders">
                        <p>📭 No orders available.</p>
                    </div>
                </div>
            </div>
        </main>
    </section>
    <script src="admin.js"></script>
</body>
</html>
